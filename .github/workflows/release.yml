name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read and verify release version
        shell: bash
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          APP_VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$APP_VERSION"
          test -n "$APP_VERSION_CODE"
          RELEASE_TAG="v$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$APP_VERSION_CODE" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            REQUESTED_TAG="$GITHUB_REF_NAME"
          else
            REQUESTED_TAG=$(printf '%s\n' "$RELEASE_COMMIT_MESSAGE" | sed -n '1s/^release: \(v[^ ]*\).*/\1/p')
          fi

          echo "requested=$REQUESTED_TAG app=$RELEASE_TAG code=$APP_VERSION_CODE"
          if [ "$REQUESTED_TAG" != "$RELEASE_TAG" ]; then
            echo "Release request $REQUESTED_TAG does not match Gradle versionName $APP_VERSION" >&2
            exit 1
          fi

      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/comfyremote.jks
          printf 'storeFile=keystore/comfyremote.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KS_PASS }}" "${{ secrets.KS_ALIAS }}" "${{ secrets.KS_PASS }}" > keystore.properties

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Smoke-test release APK
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$AAPT"
          test -x "$APKSIGNER"
          BADGING=$("$AAPT" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='com.comfyremote.app'"
          echo "$BADGING" | grep -F "versionName='$APP_VERSION'"
          echo "$BADGING" | grep -F "versionCode='$APP_VERSION_CODE'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Verify signing certificate matches beta.2
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BASELINE="$RUNNER_TEMP/Iris-v2.4.0-beta.2.apk"
          curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
            "https://github.com/Starysoor/Iris/releases/download/v2.4.0-beta.2/Iris-v2.4.0-beta.2.apk" \
            --output "$BASELINE"
          test -s "$BASELINE"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          CERT_OLD=$("$APKSIGNER" verify --print-certs "$BASELINE" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n1)
          CERT_NEW=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^.*certificate SHA-256 digest: //p' | head -n1)
          test -n "$CERT_OLD"
          test "$CERT_OLD" = "$CERT_NEW" || {
            echo "Signing certificate mismatch; beta.2 cannot be safely upgraded" >&2
            exit 1
          }
          echo "PASS: beta.2 and new release share the same signing certificate"

      - name: Name release APK and generate SHA-256
        shell: bash
        run: |
          ARTIFACT_DIR=app/build/outputs/apk/release
          cp "$ARTIFACT_DIR/app-release.apk" "$ARTIFACT_DIR/Iris-${RELEASE_TAG}.apk"
          (
            cd "$ARTIFACT_DIR"
            sha256sum "Iris-${RELEASE_TAG}.apk" > "Iris-${RELEASE_TAG}.apk.sha256"
          )
          test -s "$ARTIFACT_DIR/Iris-${RELEASE_TAG}.apk.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Iris ${{ env.RELEASE_TAG }}
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          generate_release_notes: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta.') || contains(env.RELEASE_TAG, '-rc.') }}
          files: |
            app/build/outputs/apk/release/Iris-${{ env.RELEASE_TAG }}.apk
            app/build/outputs/apk/release/Iris-${{ env.RELEASE_TAG }}.apk.sha256
