name: README · real Android screenshot gallery

on:
  push:
    branches: ['docs/iris-showcase-refresh']
    paths:
      - 'app/src/main/java/com/comfyremote/app/MainActivity.kt'
      - 'app/src/main/java/com/comfyremote/app/ShowcaseCaptureSeed.kt'
      - 'tools/qa_capture_showcase.sh'
      - '.github/workflows/readme-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install media fixture tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture screenshots from Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/qa_capture_showcase.sh
      - name: Upload original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-studio-readme-screenshots-${{ github.sha }}
          path: docs/verification/showcase-2026/
          retention-days: 30
      - name: Commit verified screenshots to this showcase branch
        if: success() && github.ref == 'refs/heads/docs/iris-showcase-refresh'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/verification/showcase-2026/*.png docs/verification/showcase-2026/*.xml docs/verification/showcase-2026/*.log
          if ! git diff --cached --quiet; then
            git commit -m "docs(showcase): refresh authentic emulator screenshots [skip ci]"
            git push origin HEAD:docs/iris-showcase-refresh
          fi
