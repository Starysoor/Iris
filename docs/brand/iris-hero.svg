</g>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<text x="91" y="87" fill="#a4b3d5" font-size="19" font-weight="650" letter-spacing="5">THE AI CREATION WORKSPACE</text>
<text x="82" y="292" fill="url(#light)" font-size="206" font-weight="750" letter-spacing="-17">IRIS</text>
<text x="92" y="359" fill="#e9eafb" font-size="29" font-weight="620" letter-spacing="4">ONE LENS. EVERY MODEL.</text>
<text x="93" y="404" fill="#a8b2d1" font-size="22">Create across local ComfyUI and the cloud — from your Android device.</text>
