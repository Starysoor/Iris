<circle r="14" fill="#e6f5ff"/>
<circle cx="-36" cy="-41" r="12" fill="#d0e6ff" opacity=".45" filter="url(#soft)"/>
<g stroke="#91a4fa" stroke-opacity=".63" stroke-width="1.6">
