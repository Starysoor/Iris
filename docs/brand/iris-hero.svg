<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Iris — One lens. Every model.</title>
<desc id="heroDesc">Dark blue Iris identity banner with violet and cyan luminous aperture rings.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09101f"/><stop offset=".48" stop-color="#0c1229"/><stop offset="1" stop-color="#110d28"/></linearGradient>
<linearGradient id="light" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#a7d8ff"/><stop offset=".48" stop-color="#a1a8ff"/><stop offset="1" stop-color="#d59bfa"/></linearGradient>
<linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#93d5fa"/><stop offset=".48" stop-color="#7d8ffb"/><stop offset="1" stop-color="#c79bf3"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7d8df5" stop-opacity=".28"/><stop offset=".55" stop-color="#7085fa" stop-opacity=".09"/><stop offset="1" stop-color="#7186fa" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d8e3ff" stroke-opacity=".038"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="18"/></filter><filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="crop"><rect width="1600" height="520" rx="36"/></clipPath>
</defs>
<g clip-path="url(#crop)">
<rect width="1600" height="520" fill="url(#bg)"/><rect width="1600" height="520" fill="url(#grid)"/>
